name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore DotnetPromptToolkit.slnx
      - name: Build
        run: dotnet build DotnetPromptToolkit.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test DotnetPromptToolkit.slnx --no-build --configuration Release --verbosity normal
